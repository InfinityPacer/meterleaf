<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Meterleaf · 暂时离线</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fa;
        color: #17201d;
      }
      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 420px);
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
        border-radius: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
        line-height: 1.25;
      }
      p {
        margin: 0;
        color: #414a55;
        line-height: 1.7;
      }
      p + p {
        margin-top: 8px;
      }
      button {
        min-height: 44px;
        margin-top: 24px;
        padding: 8px 24px;
        border: 0;
        border-radius: 8px;
        background: #07594f;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #174f91;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/icons/meterleaf-192.png"
        alt="Meterleaf"
        width="72"
        height="72"
      />
      <h1>Meterleaf 暂时离线</h1>
      <p>网络恢复后重新打开或刷新页面。</p>
      <p>账本需要联网查看。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
