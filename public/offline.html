<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Meterleaf · 暂时连不上</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fa;
        color: #17201d;
      }
      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 420px);
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
        border-radius: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
        line-height: 1.25;
      }
      p {
        margin: 0;
        color: #414a55;
        line-height: 1.7;
      }
      p + p {
        margin-top: 8px;
      }
      button {
        min-height: 44px;
        margin-top: 24px;
        padding: 8px 24px;
        border: 0;
        border-radius: 8px;
        background: #07594f;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #174f91;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/icons/meterleaf-leaf-192.png"
        alt="Meterleaf"
        width="72"
        height="72"
      />
      <h1>Meterleaf 暂时连不上</h1>
      <p>正在自动重试，连上后会直接打开账本。</p>
      <p>账本需要联网查看。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
    <script>
      // 只探测服务是否可达，不读取任何账本数据；探测地址不能是 Worker 缓存过的资源，
      // 否则离线时也会“成功”并反复刷新。网络切换后的旧连接可能挂住，
      // 每次探测都有超时；间隔逐步拉长，回到前台或网络恢复时立即再试。
      (() => {
        const timeoutMs = 8000;
        let delayMs = 3000;
        let timer = 0;
        let probing = false;
        const schedule = (ms) => {
          clearTimeout(timer);
          timer = setTimeout(probe, ms);
        };
        async function probe() {
          if (probing || document.visibilityState === "hidden") return;
          probing = true;
          try {
            await fetch("/?probe=" + Date.now(), {
              cache: "no-store",
              redirect: "manual",
              signal: AbortSignal.timeout(timeoutMs),
            });
            location.reload();
            return;
          } catch {
            delayMs = Math.min(delayMs * 2, 60000);
            schedule(delayMs);
          } finally {
            probing = false;
          }
        }
        const retryNow = () => {
          delayMs = 3000;
          schedule(0);
        };
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") retryNow();
        });
        addEventListener("online", retryNow);
        schedule(delayMs);
      })();
    </script>
  </body>
</html>
